# Kafka topic catalogue. Partition counts are sized for the local single-broker
# cluster; `partitions_full` is the recommended value for the 10M events/day
# design target (see docs/adr/0006-partitioning-strategy.md).
#
# key: the field (inside the envelope payload) used as the message key. Keys
# guarantee per-entity ordering inside a partition.
defaults:
  replication_factor: 1          # 3 in any multi-broker / production cluster
  min_insync_replicas: 1         # 2 in production
  cleanup_policy: delete
  compression_type: producer

topics:
  - name: ecommerce.customers
    entity: customers
    key: customer_id
    partitions: 3
    partitions_full: 6
    retention_ms: 1209600000     # 14 days
    cleanup_policy: delete
    event_types: [customer_registered, customer_profile_updated]
    description: Customer lifecycle events (registration, profile / loyalty changes).

  - name: ecommerce.orders
    entity: orders
    key: order_id
    partitions: 6
    partitions_full: 12
    retention_ms: 604800000      # 7 days
    event_types: [order_created, order_confirmed, order_cancelled, order_shipped, order_delivered, order_returned]
    description: Order header lifecycle; keyed by order_id so status transitions stay ordered.

  - name: ecommerce.order-items
    entity: order_items
    key: order_id
    partitions: 6
    partitions_full: 12
    retention_ms: 604800000
    event_types: [order_item_added]
    description: Order lines, co-partitioned with orders by order_id.

  - name: ecommerce.payments
    entity: payments
    key: order_id
    partitions: 6
    partitions_full: 12
    retention_ms: 604800000
    event_types: [payment_authorized, payment_captured, payment_failed]
    description: Payment attempts and outcomes, keyed by order_id for reconciliation ordering.

  - name: ecommerce.inventory
    entity: inventory
    key: product_id
    partitions: 6
    partitions_full: 12
    retention_ms: 604800000
    event_types: [inventory_reserved, inventory_released, inventory_shipped, inventory_replenished, inventory_adjusted]
    description: Inventory movements; keyed by product_id so stock deltas for a SKU are ordered.

  - name: ecommerce.shipments
    entity: shipments
    key: order_id
    partitions: 3
    partitions_full: 6
    retention_ms: 604800000
    event_types: [shipment_created, shipment_in_transit, shipment_delivered, shipment_delayed]
    description: Fulfilment and delivery tracking.

  - name: ecommerce.clickstream
    entity: clickstream
    key: session_id
    partitions: 12
    partitions_full: 24
    retention_ms: 259200000      # 3 days - highest volume, replay from Bronze afterwards
    event_types: [page_view, search, product_view, add_to_cart, remove_from_cart, checkout_started, purchase]
    description: Behavioural web / app events keyed by session to keep sessions ordered.

  - name: ecommerce.refunds
    entity: refunds
    key: order_id
    partitions: 3
    partitions_full: 6
    retention_ms: 1209600000
    event_types: [refund_issued]
    description: Monetary refunds for cancelled or returned orders.

  - name: ecommerce.returns
    entity: returns
    key: order_id
    partitions: 3
    partitions_full: 6
    retention_ms: 1209600000
    event_types: [return_requested, return_received]
    description: Product return lifecycle.

  - name: ecommerce.dead-letter
    entity: dead_letter
    key: null
    partitions: 3
    partitions_full: 3
    retention_ms: 2592000000     # 30 days to allow investigation and replay
    event_types: []
    description: Events that failed producer validation or Bronze decoding, with error metadata.
